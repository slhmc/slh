[package]
name = "slh"
version = "0.2.0"
description = "SLH portable Minecraft launcher"
authors = ["SLH"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "slh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
semver = "1"
slh-core = { path = "../crates/slh-core" }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "network", "disk"] }
async-trait = "=0.1.89"
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
futures-util = "=0.3.33"
fastnbt = "=2.6.1"
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
md5 = "=0.8.0"
regex = "=1.12.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.6"
sha2 = "=0.11.0"
shlex = "=1.3.0"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-prevent-default = { version = "=5.0.2", features = ["platform-windows"] }
tauri-plugin-single-instance = "=2.4.5"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.4"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = "=2.5.7"
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
walkdir = "=2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core-webview = { package = "windows-core", version = "=0.61.2" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]
httpmock = "=0.8.2"
