[package]
name="slh-native"
version="0.2.0"
edition="2024"
rust-version="1.97.1"
[dependencies]
slh-core={path="../slh-core"}
slint={version="=1.18.1",default-features=false,features=["std","compat-1-18","backend-winit","renderer-femtovg-wgpu","unstable-wgpu-30","unstable-winit-030"]}
tokio={version="=1.53.1",features=["rt-multi-thread","sync","time"]}
image={version="=0.25.10",default-features=false,features=["png"]}
base64="=0.22.1"
serde_json="=1.0.151"
glam={version="0.30",features=["bytemuck"]}
bytemuck={version="1",features=["derive"]}
[build-dependencies]
slint-build="=1.18.1"
